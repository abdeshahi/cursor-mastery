# Plain-HTTP front door for Marzban /sub/* only.
# Android clients (NPV, older v2rayNG) cannot fetch self-signed HTTPS subscriptions.
# Panel API stays on https://127.0.0.1:8000 — this port serves subscription links only.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    location /sub/ {
        proxy_pass https://127.0.0.1:8000/sub/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
