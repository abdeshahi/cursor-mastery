# System nginx vhost for cttel.ir (host :80 only — port 443 is Xray/Marzban).
# Install: symlink into /etc/nginx/sites-available/ and reload nginx.
# ParsPack CDN terminates public HTTPS and forwards to this origin over HTTP.

map $http_x_forwarded_proto $cttel_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.cttel.ir;

    return 301 https://cttel.ir$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cttel.ir;

    client_max_body_size 64m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cttel_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
    }
}
